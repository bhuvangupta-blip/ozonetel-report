name: Daily Ozonetel calls

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to fetch (YYYY-MM-DD). Leave blank for yesterday."
        required: false
        default: ""

concurrency:
  group: daily-calls
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_calls.py
        env:
          OZ_API_KEY: ${{ secrets.OZ_API_KEY }}
          OZ_USER: ${{ secrets.OZ_USER }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
          SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
          REPORT_DATE: ${{ github.event.inputs.date }}
